openapi: 3.0.3
info:
  title: Jobs API
  version: 1.1.0
  description: >-
    Track job applications. Register or log in to get a JWT, then click Authorize
    and paste it to call the protected endpoints.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Jobs
  - name: Health
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/updateUser:
    patch:
      tags: [Auth]
      summary: Update the current user profile
      description: Returns a fresh token because the token carries the user name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/updatePassword:
    patch:
      tags: [Auth]
      summary: Change the current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordInput'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobs:
    get:
      tags: [Jobs]
      summary: List the current user jobs
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, interview, offer, declined]
        - in: query
          name: jobType
          schema:
            type: string
            enum: [all, full-time, part-time, remote, internship]
        - in: query
          name: search
          description: Case-insensitive match on position or company
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [latest, oldest, a-z, z-a]
            default: latest
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobInput'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobs/stats:
    get:
      tags: [Jobs]
      summary: Job counts per status and per month
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: The job id
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    get:
      tags: [Jobs]
      summary: Get a job
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Jobs]
      summary: Update a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdateInput'
      responses:
        '200':
          description: Job updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Jobs]
      summary: Delete a job
      responses:
        '200':
          description: Job removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthorized:
      description: Missing or invalid token, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: The demo user is read only
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: Job not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptime:
          type: integer
          description: Seconds since the process started
        database:
          type: string
          enum: [connected, disconnected]
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          example: Jane
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          minLength: 6
          example: secret123
        lastName:
          type: string
          maxLength: 50
        location:
          type: string
          maxLength: 100
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          example: secret123
    UserProfile:
      type: object
      properties:
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        location:
          type: string
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        token:
          type: string
    UpdateUserInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        lastName:
          type: string
          maxLength: 50
        location:
          type: string
          maxLength: 100
    UpdatePasswordInput:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
    Job:
      type: object
      properties:
        _id:
          type: string
        company:
          type: string
          maxLength: 50
          example: Acme
        position:
          type: string
          maxLength: 100
          example: Backend Developer
        status:
          type: string
          enum: [pending, interview, offer, declined]
          default: pending
        jobType:
          type: string
          enum: [full-time, part-time, remote, internship]
          default: full-time
        jobLocation:
          type: string
          maxLength: 100
          example: Tunis
        notes:
          type: string
          maxLength: 500
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobInput:
      type: object
      required: [company, position]
      properties:
        company:
          type: string
          maxLength: 50
          example: Acme
        position:
          type: string
          maxLength: 100
          example: Backend Developer
        status:
          type: string
          enum: [pending, interview, offer, declined]
          default: pending
        jobType:
          type: string
          enum: [full-time, part-time, remote, internship]
          default: full-time
        jobLocation:
          type: string
          maxLength: 100
          example: Tunis
        notes:
          type: string
          maxLength: 500
    JobUpdateInput:
      type: object
      minProperties: 1
      properties:
        company:
          type: string
          maxLength: 50
          example: Acme
        position:
          type: string
          maxLength: 100
          example: Backend Developer
        status:
          type: string
          enum: [pending, interview, offer, declined]
          default: pending
        jobType:
          type: string
          enum: [full-time, part-time, remote, internship]
          default: full-time
        jobLocation:
          type: string
          maxLength: 100
          example: Tunis
        notes:
          type: string
          maxLength: 500
    Message:
      type: object
      properties:
        msg:
          type: string
    JobList:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        totalJobs:
          type: integer
        numOfPages:
          type: integer
    Stats:
      type: object
      properties:
        defaultStats:
          type: object
          properties:
            pending:
              type: integer
            interview:
              type: integer
            offer:
              type: integer
            declined:
              type: integer
        monthlyApplications:
          type: array
          description: The six most recent months with applications, oldest first
          items:
            type: object
            properties:
              date:
                type: string
                example: 2023-09
              count:
                type: integer
