name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'swagger.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deployment half way through
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the API reference page reads the same spec the server uses
      - name: Assemble the site
        run: |
          mkdir _site
          cp landing/* _site/
          cp swagger.yaml _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
